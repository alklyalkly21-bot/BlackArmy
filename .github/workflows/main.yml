name: 🔥 Final Build with Docker
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    container: kivy/buildozer
    steps:
      - uses: actions/checkout@v2
      - name: Build APK
        run: |
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v2
        with:
          name: black-army-apk
          path: bin/*.apk
